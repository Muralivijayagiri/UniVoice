<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">UniVoice</title>
  <desc id="desc">AI outbound campaigns for university governance, with a human in the loop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>

    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave" x1="846" y1="0" x2="1014" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="0.55" stop-color="#F5D76E"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1000" cy="62" r="180" fill="url(#amberGlow)" filter="url(#blur)"/>
  <circle cx="1110" cy="286" r="150" fill="url(#tealGlow)" filter="url(#blur)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="80" y="50" width="272" height="30" rx="15" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.35"/>
    <circle cx="98" cy="65" r="4" fill="#F5D76E"/>
    <text x="112" y="69" fill="#F5D76E" font-size="10.5" font-weight="600" letter-spacing="1.8">UNIVERSITY GOVERNANCE PLATFORM</text>

    <text x="80" y="152" fill="#F8FAFC" font-size="64" font-weight="700" letter-spacing="-2.5">UniVoice</text>
    <text x="82" y="194" fill="#CBD5E1" font-size="20">AI outbound campaigns for universities — with a human in the loop.</text>

    <g font-size="12" font-weight="600">
      <rect x="80" y="228" width="152" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="156" y="250" text-anchor="middle" fill="#E2E8F0">Student records</text>

      <rect x="244" y="228" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="319" y="250" text-anchor="middle" fill="#E2E8F0">HITL approvals</text>

      <rect x="406" y="228" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="481" y="250" text-anchor="middle" fill="#E2E8F0">Campaign-ready</text>
    </g>

    <circle cx="930" cy="160" r="105" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="930" cy="160" r="78" stroke="#D4AF37" stroke-opacity="0.16" stroke-dasharray="4 8"/>

    <g stroke-linecap="round">
      <rect x="846" y="142" width="8" height="36" rx="4" fill="url(#wave)" opacity="0.45"/>
      <rect x="862" y="125" width="8" height="70" rx="4" fill="url(#wave)" opacity="0.6"/>
      <rect x="878" y="104" width="8" height="112" rx="4" fill="url(#wave)" opacity="0.8"/>
      <rect x="894" y="85" width="8" height="150" rx="4" fill="url(#wave)" opacity="1"/>
      <rect x="910" y="106" width="8" height="108" rx="4" fill="url(#wave)" opacity="0.85"/>
      <rect x="926" y="125" width="8" height="70" rx="4" fill="url(#wave)" opacity="0.6"/>
      <rect x="942" y="96" width="8" height="128" rx="4" fill="url(#wave)" opacity="1"/>
      <rect x="958" y="115" width="8" height="90" rx="4" fill="url(#wave)" opacity="0.7"/>
      <rect x="974" y="133" width="8" height="54" rx="4" fill="url(#wave)" opacity="0.5"/>
      <rect x="990" y="119" width="8" height="82" rx="4" fill="url(#wave)" opacity="0.65"/>
      <rect x="1006" y="138" width="8" height="44" rx="4" fill="url(#wave)" opacity="0.4"/>
    </g>

    <text x="930" y="292" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600" letter-spacing="2.4">DRAFT · REVIEW · APPROVE</text>
  </g>
</svg>
